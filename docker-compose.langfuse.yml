# Task 2.7 — self-hosted Langfuse (AI call cost/latency dashboard).
#
# NOT verified end-to-end: this environment has no Docker installed, so
# this file is prepared but genuinely untested — treat it as a starting
# point, not a confirmed-working setup. Langfuse's own compose file
# changes between releases; if this drifts, their docs' own quickstart
# compose file is the source of truth: https://langfuse.com/self-hosting
#
# To use:
#   1. docker compose -f docker-compose.langfuse.yml up -d
#   2. Open http://localhost:3000, create an account/project (local only —
#      this is your own instance, not langfuse.com's cloud)
#   3. Copy the generated public/secret key pair into backend/.env:
#        LANGFUSE_HOST=http://localhost:3000
#        LANGFUSE_PUBLIC_KEY=pk-lf-...
#        LANGFUSE_SECRET_KEY=sk-lf-...
#   4. Restart the backend — instrumentation wiring is Task 2.7's remaining
#      step once this is confirmed running (see config.py's langfuse_*
#      settings, currently blank/dormant by default).

services:
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      # Generate real random values for these two before any real use —
      # placeholders are fine only for a first local smoke test.
      NEXTAUTH_SECRET: changeme-generate-a-real-secret
      SALT: changeme-generate-a-real-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_db_data:
