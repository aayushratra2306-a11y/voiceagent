# Task 2.3 — coturn (the TURN relay).
#
# This is the piece that makes calls work from networks where the two
# sides can never reach each other directly: corporate firewalls,
# symmetric NAT, some mobile carriers. STUN alone tells each side its own
# public address, which is enough on a typical home network and useless on
# a restrictive one. TURN relays the media through this server instead.
#
# NOTE: coturn does NOT expand ${ENV_VAR} in this file — it reads it
# literally. Anything environment-specific (public IP, credentials) is
# therefore passed as command-line flags from docker-compose.yml, which
# DOES substitute env vars. Only static config lives here.

listening-port=3478
# TLS-wrapped TURN, for networks that block anything that isn't 443/TLS.
tls-listening-port=5349

realm=voiceagent
lt-cred-mech

# Relay port range — must match the UDP range opened in the cloud firewall
# AND in Oracle's security list. Narrower than coturn's default (49152-
# 65535) to keep the firewall rule manageable; still far more concurrent
# relays than this project will need for a long time.
min-port=49160
max-port=49200

# Don't relay to private/loopback ranges — without these, a TURN server is
# an open relay into your own internal network.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Quieter logs; drop `simple-log` and add `verbose` while debugging a
# connection problem.
no-cli
simple-log
