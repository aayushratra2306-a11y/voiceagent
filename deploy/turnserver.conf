# Task 2.3 — coturn (the TURN relay).
#
# This is the piece that makes calls work from networks where the two
# sides can never reach each other directly: corporate firewalls,
# symmetric NAT, some mobile carriers. STUN alone tells each side its own
# public address, which is enough on a typical home network and useless on
# a restrictive one. TURN relays the media through this server instead.
#
# NOTE: coturn does NOT expand ${ENV_VAR} in this file — it reads it
# literally. Anything environment-specific (public IP, credentials) is
# therefore passed as command-line flags from docker-compose.yml, which
# DOES substitute env vars. Only static config lives here.

listening-port=3478
# TLS-wrapped TURN, for networks that block anything that isn't 443/TLS.
tls-listening-port=5349

realm=voiceagent
lt-cred-mech

# Relay port range — must match the UDP range opened in the cloud firewall
# AND in Oracle's security list. Narrower than coturn's default (49152-
# 65535) to keep the firewall rule manageable; still far more concurrent
# relays than this project will need for a long time.
min-port=49160
max-port=49200

# Don't relay to private/loopback ranges — without these, a TURN server is
# an open relay into your own internal network.
#
# Review finding I5 (2026-09-10) — this list was incomplete in the way that
# mattered most. It covered the three RFC1918 ranges and loopback, and
# missed 169.254.0.0/16 entirely. On a cloud VM that is not an obscure
# corner: 169.254.169.254 is the metadata service, which hands out the
# instance's own service-account token to anything on the box that asks.
# The credentials to use this relay are handed to every browser that opens
# the app (see the note on quotas below), so "anything that asks" included
# anyone who read their own network settings.
#
# It also had no IPv6 at all. A dual-stack peer could be named by its IPv6
# address and skip every rule here, and IPv4-mapped IPv6 (::ffff:10.0.0.1)
# is the same bypass wearing a hat.
#
# The list below is coturn's own recommended deny set from its shipped
# example config, plus CGNAT. Taken verbatim rather than hand-rolled
# precisely because a typo here fails OPEN and silently.
no-multicast-peers

# Relaying to a peer over TCP is not something WebRTC media needs — the
# media itself is UDP. Leaving it on mostly offers a general-purpose TCP
# proxy to whoever holds a credential.
no-tcp-relay

# "This network", loopback, link-local/metadata, RFC1918, CGNAT.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255

# IPv6: loopback, IPv4-mapped (the bypass), NAT64, unique-local, link-local.
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Review finding I5 — there were no limits of any kind. One static
# credential is handed to every browser that loads the app, so in practice
# the relay is usable by anyone who looks at their own network settings,
# and an unmetered relay is free bandwidth for whoever finds it.
#
# These are sized for what this actually carries. Note the unit: coturn's
# max-bps and bps-capacity are BYTES per second, not bits — easy to read
# past, and reading it as bits makes every number here look 8x tighter than
# it is. Opus speech is roughly 5-8 KB/s each way, so 256 KB/s per session
# is well over an order of magnitude of headroom: it constrains bulk
# transfer and video without coming anywhere near a real call.
# min-port/max-port above already caps the server at ~20 concurrent relays,
# so total-quota is a backstop rather than the binding limit.
#
# Raise these if a legitimate call is ever throttled — but raise them from
# a measurement, not a guess.
user-quota=12
total-quota=100
max-bps=256000

# NOTE (review finding I5, not yet done): the credential itself is still a
# single static username/password, passed as --user from docker-compose.yml
# and served to every authenticated browser by /ice-servers. The fix is
# coturn's `use-auth-secret` + `static-auth-secret=<secret>`, with the
# backend generating `username=<unix-expiry>` and
# `credential=base64(HMAC-SHA1(secret, username))` per request, so a leaked
# credential dies in minutes rather than living until someone rotates it by
# hand. That is a coordinated backend + deploy change and is tracked
# separately; the limits above are what reduces the damage until then.

# Quieter logs; drop `simple-log` and add `verbose` while debugging a
# connection problem.
no-cli
simple-log
