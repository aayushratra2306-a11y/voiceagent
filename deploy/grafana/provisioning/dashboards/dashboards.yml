apiVersion: 1

providers:
  - name: voiceagent
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    # Picks up edits to the JSON without a restart, which matters while
    # someone is actually tuning the panels.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
