name: CI

# Task 2.9 — automated testing on every push. Deliberately does NOT deploy
# anything: the project owner has explicitly deferred deployment until a
# specific go-ahead (see project memory) — this workflow stops at "tests
# pass", not "ship it". A commented deploy job template sits at the bottom
# for whenever that decision is made.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SECRET_KEY, OPENAI_API_KEY, DEEPGRAM_API_KEY,
#   CARTESIA_API_KEY, PINECONE_API_KEY, GROQ_API_KEY
# These mirror backend/.env's required fields (see app/core/config.py) —
# without them, Settings() can't even construct, so every job below fails
# immediately with a clear pydantic validation error, not a mysterious one.
#
# MONGODB_URL is deliberately NOT in that list: CI supplies its own
# throwaway MongoDB (see the `test` job's services block) rather than
# reaching for Atlas. The secret can stay configured for a future deploy
# job, it just isn't read by anything here.

on:
  push:
    # phase-4 included so the branch is tested on its own pushes rather
    # than only when it is proposed for merge. It carries a whole phase of
    # work that will sit unmerged until Phase 3 finishes live testing, and
    # an unwatched long-lived branch is exactly where a regression waits.
    branches: [main, dev, phase-4]
  pull_request:
    branches: [main, dev]
  # Lets the rag-eval job below be run deliberately, since it no longer runs
  # on every push — see the note on that job.
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Retrieval quality drifts from data and index changes
    # rather than from any single commit, so a weekly check catches it while
    # costing ~32 rerank calls a week instead of ~32 per push.
    - cron: "0 6 * * 1"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    # A throwaway MongoDB for the duration of the job, NOT the real Atlas
    # cluster. Atlas allowlists specific IPs (the laptop and the deployed
    # VM); GitHub runners get a fresh random IP every run, so Atlas refuses
    # them and every test errors on connect. The wrong fix is allowlisting
    # 0.0.0.0/0 on Atlas — that exposes production data to the internet to
    # make a test pass. This is the right one: CI gets its own empty
    # database, and conftest's teardown (which drops the whole database)
    # can never touch real data even by accident.
    #
    # Standalone, no replica set: nothing in app/ or tests/ uses
    # transactions, and those are the only thing that would require one.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URL: mongodb://localhost:27017
      DB_NAME: voiceagent_ci
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Excludes tests/rag_eval — see the rag-eval job below for why.
      #
      # Piped through `set +e` + explicit exit-code capture, NOT through
      # `tee`/`| tail` directly — a plain pipe's exit status is the LAST
      # command in it, which already bit this project once (aa46f93 shipped
      # with 10 lint errors because `ruff ... | tail -1` reported tail's
      # exit code, not ruff's). The point of the extra step below is
      # surfacing WHY a run failed without needing the Actions log-download
      # permission this repo doesn't have configured — the job summary is
      # readable through the plain API.
      - name: Run tests
        run: |
          set +e
          pytest tests/ --ignore=tests/rag_eval -v > pytest_output.txt 2>&1
          code=$?
          cat pytest_output.txt
          exit $code
      - name: Show failure details in the job summary
        if: failure()
        run: |
          {
            echo '## Test failures'
            echo '```'
            grep -B 2 -A 40 "^FAILED\|^ERROR\|Error:\|Traceback" pytest_output.txt | tail -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # continue-on-error: informational for now. The manual's own point
      # (task 2.9) is catching a newly-introduced vulnerable dependency —
      # flip this to blocking once a first clean baseline run confirms
      # nothing already in requirements.txt trips it.
      - run: pip-audit -r requirements.txt --strict
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The RAG document-search quality suite (Task 2.8) makes real calls to
  # OpenAI, Groq, and Pinecone — real external services, real cost, real
  # network-flake risk. Kept separate from `test` (which blocks merges) so
  # a transient third-party hiccup never blocks unrelated work; it still
  # runs and reports on every push, just doesn't gate anything yet.
  # Promote it to a `needs:` of a branch-protection rule once it's proven
  # stable over a few weeks of real runs.
  #
  # Runs pytest, NOT `python -m tests.rag_eval.run_eval`. The CLI exits
  # non-zero unless all 32 questions pass, but the live baseline is 28/32
  # and those 4 misses are known, understood limitations — so as a CI step
  # it failed on every single run and could never have done anything else.
  # A check that cannot pass reports nothing and teaches you to ignore red.
  # test_rag_quality.py asserts against a margin (24/32) instead, which is
  # what actually catches a regression rather than normal retrieval drift.
  # Runs on main, on demand, and weekly -- NOT on every dev push.
  #
  # Found 2026-09-04: Pinecone's free tier allows 500 reranks per month
  # across the whole organisation, and this job spends 32 of them every time
  # it runs. Five pushes in a day is 160, so the month's budget went in a few
  # days of ordinary work and live calls started silently falling back to raw
  # cosine similarity -- measurably worse ranking (see RERANK_MODEL's comment
  # in services/rag.py for a case where the correct chunk missed the raw
  # top-5 entirely), plus a 3.5s retrieval budget overrun on a real call.
  #
  # Retrieval quality drifts from document and index changes rather than from
  # any one commit, so per-push was always the wrong cadence for it. It is
  # already continue-on-error and deliberately not a required check, so
  # nothing depends on it gating a dev push.
  rag-eval:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main'
    # Retrieval itself never touches MongoDB — only Pinecone, OpenAI and
    # Groq. The container is here because tests/conftest.py has an autouse,
    # session-scoped fixture that calls init_db(), and a conftest applies to
    # every subdirectory beneath it. Without a database to reach, that
    # fixture errors before a single retrieval question runs.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URL: mongodb://localhost:27017
      DB_NAME: voiceagent_ci
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/rag_eval -v

  # --- Deployment: intentionally disabled. -----------------------------
  # Uncomment and fill in once a deploy target is chosen AND the project
  # owner explicitly says to turn this on — do not enable unilaterally.
  #
  # deploy:
  #   runs-on: ubuntu-latest
  #   needs: [test, lint, secret-scan]
  #   if: github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Deploy
  #       run: echo "wire up Fly.io / Railway here"
